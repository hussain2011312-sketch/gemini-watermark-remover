name: Website build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && rm -f dist/onnxruntime/ort-wasm-simd-threaded.jsep.mjs dist/onnxruntime/ort-wasm-simd-threaded.jsep.wasm && node website/build-site.mjs
      - run: test -f site-dist/index.html && test -f site-dist/app.js && test -f site-dist/video-preview.html && test -f site-dist/video-app.js
